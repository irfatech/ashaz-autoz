# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

app_title: Ashaz Autoz
backend:
  name: github
  repo: irfatech/ashaz-autoz
  branch: main

logo:
  src: /ashaz-logo.webp
  show_in_header: true

media_folder: "public/images"
public_folder: "/images"

media_libraries:
  default:
    config:
      max_file_size: 5242880
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2048

output:
  omit_empty_optional_fields: true

collections:
  # --- Shown to the car owner: the content that actually changes ---
  - name: "vehicles"
    label: "Vehicles"
    label_singular: "Vehicle"
    description: "One entry per car model. The most-edited fields come first; VIN and other internal numbers are at the bottom."
    folder: "src/content/vehicles"
    create: true
    # `year` is also a predefined date tag in slug templates, so the field needs the `fields.` prefix
    slug:
      template: "{{brand}}-{{model}}-{{fields.year}}"
      editable: [create]
      hint: "Becomes the file name and the page URL. It cannot be changed after the vehicle is saved."
      pattern: ['^[a-z0-9-]+$', "Use lowercase letters, numbers and hyphens only."]
    identifier_field: model
    # `| date('YYYY')` prints the raw number; a plain {{year}} shows "2,021" (locale formatting)
    summary: "{{brand}} {{model}} ({{year | date('YYYY')}}) · {{status}}"
    preview_path: "vehicles/{{slug}}/"
    # One folder per car. Folder templates cannot use field values, and {{year}} there is the date the
    # photo was uploaded, not the car's year, so the slug (brand-model-year) is used instead.
    media_folder: "{{media_folder}}/Cars/{{slug}}"
    public_folder: "{{public_folder}}/Cars/{{slug}}"
    editor:
      preview: false
    sortable_fields:
      fields: [year, price, mileage, status, brand]
      default:
        field: year
        direction: descending
    # Filters in Sveltia are checkboxes combined with AND, so only non-exclusive toggles are filters.
    # Status (mutually exclusive) is the default grouping instead, so every status is visible at once.
    view_filters:
      - { label: "Hide sold", field: status, ne: "Sold" }
      - { label: "Featured", field: featured, eq: true }
      - { label: "Price on request", field: priceOnRequest, eq: true }
      - { label: "Missing photos", field: images, empty: true }
    view_groups:
      default: status
      groups:
        - { name: status, label: "Status", field: status }
        - { name: brand, label: "Brand", field: brand }
    fields:
      - { label: "Brand", name: "brand", widget: "string", hint: "e.g. Toyota. The file name and URL are built from brand, model and year." }
      - label: "Model"
        name: "model"
        widget: "string"
        hint: "The model name only, e.g. Hilux or Alto. Not the year."
        pattern: ['^(?!\d{4}$).+', "Enter the model name (e.g. Alto), not the year."]
      - { label: "Year", name: "year", widget: "number", value_type: "int", min: 2000, max: 2030 }
      - { label: "Price", name: "price", widget: "number", value_type: "int", min: 0, step: -1, before_input: "$", hint: "Leave 0 when Price on request is on." }
      - { label: "Price on request", name: "priceOnRequest", widget: "boolean", default: false, required: false, hint: "Hides the price and shows a Reserve button instead (new launches)." }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Available", "Reserved", "Sold", "Upcoming"]
        default: "Available"
        hint: "Sold cars stay on the site but are removed from the sitemap."
      - { label: "Mileage", name: "mileage", widget: "number", value_type: "int", min: 0, step: -1, after_input: "km" }
      - label: "Gallery Images"
        name: "images"
        widget: "image"
        multiple: true
        min: 1
        max: 20
        hint: "Photos shown for every color (interior, engine, general views). Add 1 to 20 at once, or drag them in. For a single-color car this is the whole gallery. JPEG, PNG and iPhone HEIC photos are converted to WebP, resized and stripped of GPS data automatically."
        media_libraries:
          default:
            config:
              # Photos are renamed on save, e.g. toyota-roomy-2021-a1b2c3d4.webp, instead of img_6618.webp
              filename_template: "{{slug}}-{{uuid_shorter}}"
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Show on the home page." }
      - label: "Colors"
        name: "colors"
        widget: "list"
        required: false
        label_singular: "Color"
        summary: "{{name}}"
        thumbnail: "images"
        collapsed: true
        allow_reorder: true
        hint: "Add every color this car comes in, in one entry. The first color is the one shown first on the site (a sold-out color is skipped). Add that color's own photos here; photos that look the same in every color go under Gallery Images."
        fields:
          - { label: "Color name", name: "name", widget: "string", hint: "e.g. Black, Pearl White" }
          - { label: "Swatch color", name: "hex", widget: "color", required: false, hint: "Optional. Common color names get a swatch automatically." }
          - { label: "Stock", name: "units", widget: "number", value_type: "int", min: 0, required: false, hint: "Leave blank = in stock. 0 = sold out. 3 = shows '3 available'." }
          - label: "Photos of this color"
            name: "images"
            widget: "image"
            multiple: true
            required: false
            hint: "The car in this color. They are shown before the Gallery Images."
            media_libraries:
              default:
                config:
                  filename_template: "{{slug}}-{{uuid_shorter}}"
      - label: "Transmission"
        name: "transmission"
        widget: "select"
        options: ["Automatic", "Manual", "CVT", "DCT"]
        default: "Automatic"
      - label: "Fuel Type"
        name: "fuelType"
        widget: "select"
        options: ["Petrol", "Diesel", "Hybrid", "Electric", "LPG"]
        default: "Petrol"
      - label: "Drive Type"
        name: "driveType"
        widget: "select"
        options: ["FWD", "RWD", "AWD", "4WD"]
      - label: "Body Type"
        name: "bodyType"
        widget: "select"
        required: false
        options: ["Hatchback", "Sedan", "SUV", "Compact SUV", "Pickup", "Van", "Minibus", "Wagon", "Coupe"]
      - { label: "Engine", name: "engine", widget: "string", required: false, hint: "e.g. 1500cc or 2.4L Turbo" }
      - { label: "Doors", name: "doors", widget: "number", required: false, value_type: "int" }
      - { label: "Seats", name: "seats", widget: "number", required: false, value_type: "int" }
      - { label: "Features", name: "features", widget: "list", required: false, field: { label: "Feature", name: "feature", widget: "string" } }
      - { label: "Description", name: "body", widget: "markdown", required: false }
      - { label: "Currency", name: "currency", widget: "string", default: "USD" }
      - { label: "VIN", name: "vin", widget: "string", required: false, unique: true, hint: "Internal. Used only to prefill quotations and invoices." }
      - { label: "Chassis Number", name: "chassisNumber", widget: "string", required: false, unique: true, hint: "Internal. Used only to prefill quotations and invoices." }
      - { label: "Engine Number", name: "engineNumber", widget: "string", required: false, unique: true, hint: "Internal. Used only to prefill quotations and invoices." }
      - { label: "Registration No.", name: "registrationNo", widget: "string", required: false, unique: true, hint: "Internal. Used only to prefill quotations and invoices." }

  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{title}}"
    preview_path: "blog/{{slug}}/"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Author", name: "author", widget: "string", default: "Ashaz Autoz" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Category", name: "category", widget: "string", default: "General" }
      - { label: "Tags", name: "tags", widget: "list", required: false, field: { label: "Tag", name: "tag", widget: "string" } }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "site-settings"
    label: "Site Settings"
    files:
      - label: "Settings"
        name: "settings"
        file: "src/content/site-settings/settings.yaml"
        fields:
          - { label: "Site Name", name: "siteName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "URL", name: "url", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image", required: false }
          - { label: "Favicon", name: "favicon", widget: "string", required: false }
          - label: "Phone"
            name: "phone"
            widget: "list"
            field: { label: "Number", name: "number", widget: "string" }
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "Address", name: "address", widget: "text", required: false }
          - { label: "Working Hours", name: "workingHours", widget: "string", required: false }
          - { label: "Google Maps Embed URL", name: "googleMapsEmbedUrl", widget: "string", required: false }
          - { label: "Latitude", name: "lat", widget: "number", value_type: "float", min: -90, max: 90, required: false, hint: "Used for the map pin in search results." }
          - { label: "Longitude", name: "lng", widget: "number", value_type: "float", min: -180, max: 180, required: false }
          - { label: "Founded (year)", name: "foundingYear", widget: "number", value_type: "int", min: 1900, max: 2100, step: -1, required: false }
          - { label: "Price Range", name: "priceRange", widget: "string", required: false, hint: "Currency signs shown in search results: $, $$ or $$$." }
          - label: "Social"
            name: "social"
            widget: "object"
            required: false
            fields:
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "TikTok", name: "tiktok", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }
              - { label: "WhatsApp", name: "whatsapp", widget: "string", required: false }

  # --- Hidden from the menu (kept, so they can be switched back on by removing `hide: true`) ---
  - name: "pages"
    label: "Pages"
    hide: true
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    preview_path: "{{slug}}/"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", required: false, hint: "Hero/featured image for the page" }
      - { label: "Published", name: "published", widget: "boolean", default: true, required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0, required: false, hint: "Sort order (lower = first)" }
      - label: "Template"
        name: "template"
        widget: "select"
        required: false
        default: "default"
        options: ["default", "full-width"]
      - { label: "Hero Title", name: "heroTitle", widget: "string", required: false }
      - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }
      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        fields:
          - { label: "Title", name: "title", widget: "string", required: false }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Image", name: "image", widget: "image", required: false }
          - { label: "No Index", name: "noIndex", widget: "boolean", required: false, default: false }

  - name: "services"
    label: "Services"
    hide: true
    folder: "src/content/services"
    create: true
    slug: "{{title}}"
    preview_path: "services/{{slug}}/"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Excerpt", name: "excerpt", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0 }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Features", name: "features", widget: "list", required: false, field: { label: "Feature", name: "feature", widget: "string" } }
      - { label: "CTA Text", name: "ctaText", widget: "string", default: "Learn More" }
      - { label: "CTA Link", name: "ctaLink", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "testimonials"
    label: "Testimonials"
    hide: true
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string", required: false }
      - { label: "Company", name: "company", widget: "string", required: false }
      - { label: "Avatar", name: "avatar", widget: "image", required: false }
      - { label: "Rating", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5 }
      - { label: "Content", name: "content", widget: "text" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }

  - name: "team"
    label: "Team Members"
    hide: true
    folder: "src/content/team"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Bio", name: "bio", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0 }

  - name: "faq"
    label: "FAQs"
    hide: true
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Category", name: "category", widget: "string", default: "General" }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0 }

  - name: "gallery"
    label: "Gallery"
    hide: true
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: false }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Category", name: "category", widget: "string", default: "General" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Date", name: "date", widget: "datetime", required: false }

  - name: "navigation"
    label: "Navigation"
    hide: true
    files:
      - label: "Main Navigation"
        name: "nav"
        file: "src/content/navigation/nav.yaml"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Href", name: "href", widget: "string" }
              - label: "Children"
                name: "children"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Href", name: "href", widget: "string" }

  - name: "tiktok"
    label: "TikTok Videos"
    hide: true
    folder: "src/content/tiktok"
    create: true
    slug: "{{slug}}"
    extension: yaml
    format: yaml
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "TikTok URL", name: "tiktokUrl", widget: "string" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false, hint: "Upload a preview image. If empty, a placeholder will show." }
      - { label: "Caption", name: "caption", widget: "text", required: false }
      - { label: "Category", name: "category", widget: "string", default: "General" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0, required: false }
      - { label: "Date", name: "date", widget: "datetime", required: false }

  - name: "instagram"
    label: "Instagram Posts"
    hide: true
    folder: "src/content/instagram"
    create: true
    slug: "{{slug}}"
    extension: yaml
    format: yaml
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false, hint: "Upload a preview image. If empty, a placeholder will show." }
      - { label: "Caption", name: "caption", widget: "text", required: false }
      - { label: "Category", name: "category", widget: "string", default: "General" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 0, required: false }
      - { label: "Date", name: "date", widget: "datetime", required: false }

  - name: "footer"
    label: "Footer"
    hide: true
    files:
      - label: "Footer Content"
        name: "footer"
        file: "src/content/footer/footer.yaml"
        fields:
          - { label: "Description", name: "description", widget: "text", required: false }
          - label: "Columns"
            name: "columns"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Links"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Href", name: "href", widget: "string" }
          - { label: "Bottom Text", name: "bottomText", widget: "string", required: false }
